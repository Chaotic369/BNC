<!DOCTYPE html>
<html lang="en">
<head>
<title>Crypto 10m Heatmap</title>
<style>
  * { box-sizing: border-box; }
  body { background: #292d32; color: #e0e5ec; font-family: Arial, sans-serif; margin: 0; width: 100vw; height: 100vh; overflow: hidden; display: flex; flex-direction: column; padding: 20px; }
  #ctrl { display: flex; gap: 15px; margin-bottom: 20px; padding: 15px; border-radius: 15px; box-shadow: 7px 7px 14px #1c1e22, -7px -7px 14px #363c42; }
  select { background: #292d32; color: #e0e5ec; border: none; padding: 10px 15px; border-radius: 8px; box-shadow: inset 3px 3px 6px #1c1e22, inset -3px -3px 6px #363c42; outline: none; font-weight: bold; cursor: pointer; }
  #chart-container { flex: 1; border-radius: 15px; box-shadow: inset 5px 5px 10px #1c1e22, inset -5px -5px 10px #363c42; padding: 15px; position: relative; display: flex; }
  canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div id="ctrl">
  <select id="pair">
    <option value="BTCUSDT">BTCUSDT</option>
    <option value="ETHUSDT">ETHUSDT</option>
    <option value="BNBUSDT">BNBUSDT</option>
    <option value="SOLUSDT">SOLUSDT</option>
    <option value="XRPUSDT">XRPUSDT</option>
  </select>
  <select id="time">
    <option value="1m">1m</option>
    <option value="15m">15m</option>
    <option value="1h" selected>1h</option>
    <option value="4h">4h</option>
    <option value="1d">1d</option>
  </select>
</div>
<div id="chart-container">
  <canvas id="cvs"></canvas>
</div>
<script>
const pairSel = document.getElementById('pair'), timeSel = document.getElementById('time');
const cvs = document.getElementById('cvs'), ctx = cvs.getContext('2d');
let chartData = [], sym, intv, res, data, w, h, minP, maxP, rng, stepX, x, oY, hY, lY, cY, color, timerId, intvMs, nextOpen, remMs, remStr, lastC;

async function loadData() {
  sym = pairSel.value; intv = timeSel.value;
  res = await fetch(`https://api.binance.com/api/v3/klines?symbol=${sym}&interval=${intv}&limit=60`);
  data = await res.json();
  chartData = data.map(d => ({ t: d[0], o: parseFloat(d[1]), h: parseFloat(d[2]), l: parseFloat(d[3]), c: parseFloat(d[4]) }));
  drawChart();
}

function drawChart() {
  cvs.width = cvs.parentElement.clientWidth - 30;
  cvs.height = cvs.parentElement.clientHeight - 30;
  w = cvs.width; h = cvs.height;
  ctx.clearRect(0, 0, w, h);
  if (!chartData.length) return;

  minP = Math.min(...chartData.map(d => d.l)); maxP = Math.max(...chartData.map(d => d.h));
  rng = (maxP - minP) || 1;

  // Draw Neomorphic Axes Double-line illusion
  ctx.strokeStyle = '#1c1e22'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(60, 0); ctx.lineTo(60, h - 30); ctx.lineTo(w, h - 30); ctx.stroke();
  ctx.strokeStyle = '#363c42';
  ctx.beginPath(); ctx.moveTo(61, 1); ctx.lineTo(61, h - 29); ctx.lineTo(w, h - 29); ctx.stroke();

  // Draw OHLC Candlesticks with 100px breathing room on the right
    stepX = (w - 170) / Math.max(1, chartData.length - 1);
    chartData.forEach((d, i) => {
      x = 70 + i * stepX; 
      oY = (h - 40) - ((d.o - minP) / rng) * (h - 60);
      hY = (h - 40) - ((d.h - minP) / rng) * (h - 60);
      lY = (h - 40) - ((d.l - minP) / rng) * (h - 60);
      cY = (h - 40) - ((d.c - minP) / rng) * (h - 60);
      color = d.c >= d.o ? '#00ffaa' : '#ff4444';
      
      ctx.strokeStyle = color; ctx.fillStyle = color; ctx.lineWidth = 1;
      // Wick
      ctx.beginPath(); ctx.moveTo(x, hY); ctx.lineTo(x, lY); ctx.stroke();
      // Body
      ctx.fillRect(x - (stepX/3), Math.min(oY, cY), Math.max(1, (stepX/1.5)), Math.max(1, Math.abs(oY - cY)));
    });
  
    // Price Line & Candle Timer in the breathing room
    lastC = chartData[chartData.length - 1];
    cY = (h - 40) - ((lastC.c - minP) / rng) * (h - 60);
    
    ctx.setLineDash([4, 4]); ctx.strokeStyle = '#e0e5ec'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, cY); ctx.lineTo(w, cY); ctx.stroke();
    ctx.setLineDash([]);
    
    intvMs = parseInt(intv) * (intv.endsWith('m') ? 60000 : intv.endsWith('h') ? 3600000 : 86400000);
    nextOpen = lastC.t + intvMs;
    remMs = Math.max(0, nextOpen - Date.now());
    remStr = new Date(remMs).toISOString().slice(11, 19); // Extracts HH:MM:SS
    
    ctx.fillStyle = color; ctx.textAlign = 'left';
    ctx.fillText(lastC.c.toFixed(2), x + 10, cY - 8);
    ctx.fillText(remStr, x + 10, cY + 12);
  
    // Draw Axis Labels
    ctx.fillStyle = '#e0e5ec'; ctx.font = '12px Arial'; ctx.textAlign = 'right';
    ctx.fillText(maxP.toFixed(2), 55, 20);
    ctx.fillText(minP.toFixed(2), 55, h - 40);
    
    ctx.textAlign = 'center';
    ctx.fillText(new Date(chartData[0].t).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), 70, h - 10);
    ctx.fillText(new Date(lastC.t).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}), x, h - 10);
  }
  
  if (!timerId) timerId = setInterval(drawChart, 1000); // Redraw every second to animate timer
  window.addEventListener('resize', drawChart);
  pairSel.addEventListener('change', loadData);
  timeSel.addEventListener('change', loadData);
  loadData();
</script>
</body>
</html>
